---
layout: default
title: APDL 腳本目錄
---

<style>
  .catalog-app {
    --border: #eaeef2;
    --muted: #6e7781;
    color: #24292f;
  }
  .catalog-breadcrumb {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: .3rem;
    margin-bottom: 1.5rem;
    color: var(--muted);
    font-size: .85rem;
  }
  .catalog-breadcrumb a {
    color: #0969da;
    text-decoration: none;
  }
  .catalog-breadcrumb a:hover { text-decoration: underline; }
  .catalog-breadcrumb-sep { color: var(--muted); }
  .catalog-view h1 {
    font-size: 1.4rem;
    margin-bottom: .3rem;
    padding-bottom: .55rem;
    border-bottom: 1px solid var(--border);
    word-break: break-all;
  }
  .catalog-help, .catalog-empty, .catalog-status { color: var(--muted); font-size: .9rem; }
  .catalog-list {
    list-style: none;
    margin: 1rem 0;
    padding: 0;
  }
  .catalog-entry {
    padding: .45rem 0;
    border-bottom: 1px solid var(--border);
  }
  .catalog-entry:last-child { border-bottom: 0; }
  .catalog-entry::before {
    content: "- ";
    color: var(--muted);
  }
  .catalog-entry-folder::before {
    content: "\01F4C1 ";
  }
  .catalog-entry-name {
    color: #0969da;
    text-decoration: none;
  }
  .catalog-entry-name:hover, .catalog-entry-name:focus-visible {
    text-decoration: underline;
  }
  .catalog-entry-meta {
    margin-left: .4rem;
    color: var(--muted);
    font-size: .85rem;
  }
  .catalog-code {
    overflow: auto;
    margin-top: 1rem;
    padding: 1rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #f6f8fa;
    color: #24292f;
    font: .875rem/1.6 ui-monospace, "Cascadia Code", Consolas, "Courier New", monospace;
    tab-size: 4;
    white-space: pre;
  }
  .catalog-error {
    padding: .85rem 1rem;
    border-left: 4px solid #cf222e;
    background: #fff8f8;
    color: #82061e;
  }
  [hidden] { display: none !important; }
  @media (max-width: 600px) {
    .catalog-code {
      margin-right: -.5rem;
      margin-left: -.5rem;
      font-size: .82rem;
    }
  }
</style>

<div class="catalog-app" id="catalog-app">
  <nav class="catalog-breadcrumb" id="breadcrumb" aria-label="目前位置"></nav>

  <section class="catalog-view" id="browse-view">
    <h1 id="browse-title">APDL 腳本目錄</h1>
    <p class="catalog-help">點選資料夾或腳本以繼續瀏覽。</p>
    <ul class="catalog-list" id="browse-list"></ul>
    <p class="catalog-empty" id="browse-empty" hidden>
      這個資料夾裡還沒有子資料夾或腳本。請將檔案放入 <code>scripts/分類資料夾/</code>。
    </p>
  </section>

  <section class="catalog-view" id="script-view" hidden>
    <h1 id="script-title"></h1>
    <p class="catalog-status" id="script-status" aria-live="polite"></p>
    <pre class="catalog-code" id="script-panel" tabindex="0" hidden><code id="script-code"></code></pre>
  </section>

  <section class="catalog-view" id="error-view" hidden>
    <h1>找不到項目</h1>
    <p class="catalog-error" id="route-error"></p>
  </section>

  <noscript><p class="catalog-error">這個自動目錄需要啟用 JavaScript。</p></noscript>
</div>

<script id="catalog-data" type="application/json">
[
{% assign catalog_files = site.static_files | sort: "path" %}
{% assign first_script = true %}
{% for file in catalog_files %}
  {% assign parts = file.path | split: "/" %}
  {% assign extension = file.extname | downcase %}
  {% if parts[1] == "scripts" and parts.size >= 3 %}
    {% if extension == ".mac" or extension == ".inp" or extension == ".txt" %}
      {% unless first_script %},{% endunless %}
      {
        "path": {{ file.path | remove_first: "/scripts/" | jsonify }},
        "url": {{ file.path | remove_first: "/" | jsonify }},
        "name": {{ file.name | jsonify }},
        "extension": {{ extension | jsonify }}
      }
      {% assign first_script = false %}
    {% endif %}
  {% endif %}
{% endfor %}
]
</script>

<script>
  (() => {
    "use strict";

    const byId = (id) => document.getElementById(id);
    const views = [byId("browse-view"), byId("script-view"), byId("error-view")];
    const breadcrumb = byId("breadcrumb");
    const browseTitle = byId("browse-title");
    const browseList = byId("browse-list");
    const browseEmpty = byId("browse-empty");
    const scriptTitle = byId("script-title");
    const scriptStatus = byId("script-status");
    const scriptPanel = byId("script-panel");
    const scriptCode = byId("script-code");
    const routeError = byId("route-error");
    const collator = new Intl.Collator("zh-Hant", {
      numeric: true,
      sensitivity: "base"
    });

    let scripts;
    let activeRequest = 0;

    function showOnly(view) {
      views.forEach((item) => {
        item.hidden = item !== view;
      });
    }

    function showError(message) {
      activeRequest += 1;
      document.title = "找不到項目 | APDL 腳本目錄";
      breadcrumb.replaceChildren();
      routeError.textContent = message;
      showOnly(byId("error-view"));
    }

    try {
      scripts = JSON.parse(byId("catalog-data").textContent);
    } catch (error) {
      scripts = [];
      showError("腳本目錄資料無法解析。");
      return;
    }

    scripts.sort((left, right) => collator.compare(left.path, right.path));
    const scriptByPath = new Map(
      scripts.map((script) => [script.path, script])
    );

    // Build a folder tree from the flat file list so that any depth of
    // sub-folders under scripts/ can be browsed, not just one level.
    const root = { name: "", dirs: new Map(), files: [] };

    function ensureDir(parent, name, path) {
      if (!parent.dirs.has(name)) {
        parent.dirs.set(name, { name, path, dirs: new Map(), files: [] });
      }
      return parent.dirs.get(name);
    }

    scripts.forEach((script) => {
      const segments = script.path.split("/");
      const fileName = segments.pop();
      let node = root;
      let accum = [];
      segments.forEach((segment) => {
        accum.push(segment);
        node = ensureDir(node, segment, accum.join("/"));
      });
      node.files.push(script);
    });

    function findDir(pathStr) {
      if (!pathStr) {
        return root;
      }
      let node = root;
      for (const segment of pathStr.split("/")) {
        node = node.dirs.get(segment);
        if (!node) {
          return null;
        }
      }
      return node;
    }

    function routeHash(type, value) {
      return "#" + type + "=" + encodeURIComponent(value);
    }

    function createEntry(href, name, meta, isFolder) {
      const item = document.createElement("li");
      const link = document.createElement("a");
      const metaElement = document.createElement("span");

      item.className = "catalog-entry" + (isFolder ? " catalog-entry-folder" : "");
      link.className = "catalog-entry-name";
      link.href = href;
      link.textContent = name;
      metaElement.className = "catalog-entry-meta";
      metaElement.textContent = meta;
      item.append(link, metaElement);
      return item;
    }

    function renderBreadcrumb(dirSegments, currentFileName) {
      breadcrumb.replaceChildren();

      const homeLink = document.createElement("a");
      homeLink.href = routeHash("dir", "");
      homeLink.textContent = "scripts";
      breadcrumb.append(homeLink);

      const linkableSegments = currentFileName
        ? dirSegments
        : dirSegments.slice(0, -1);
      const accum = [];

      linkableSegments.forEach((segment) => {
        accum.push(segment);
        breadcrumb.append(makeSep());
        const link = document.createElement("a");
        link.href = routeHash("dir", accum.join("/"));
        link.textContent = segment;
        breadcrumb.append(link);
      });

      if (currentFileName) {
        breadcrumb.append(makeSep());
        const span = document.createElement("span");
        span.textContent = currentFileName;
        breadcrumb.append(span);
      } else if (dirSegments.length > 0) {
        breadcrumb.append(makeSep());
        const span = document.createElement("span");
        span.textContent = dirSegments[dirSegments.length - 1];
        breadcrumb.append(span);
      }
    }

    function makeSep() {
      const sep = document.createElement("span");
      sep.className = "catalog-breadcrumb-sep";
      sep.setAttribute("aria-hidden", "true");
      sep.textContent = "/";
      return sep;
    }

    function renderBrowse(pathStr) {
      activeRequest += 1;
      const node = findDir(pathStr);
      if (!node) {
        showError("找不到資料夾：" + pathStr);
        return;
      }

      const dirSegments = pathStr ? pathStr.split("/") : [];
      const label = dirSegments.length
        ? dirSegments[dirSegments.length - 1]
        : "APDL 腳本目錄";
      document.title = pathStr ? label + " | APDL 腳本目錄" : "APDL 腳本目錄";
      renderBreadcrumb(dirSegments, null);
      browseTitle.textContent = label;
      browseList.replaceChildren();

      const subDirs = [...node.dirs.values()]
        .sort((left, right) => collator.compare(left.name, right.name));
      const files = [...node.files]
        .sort((left, right) => collator.compare(left.name, right.name));

      browseEmpty.hidden = subDirs.length + files.length !== 0;

      subDirs.forEach((dir) => {
        const itemCount = countItems(dir);
        browseList.append(createEntry(
          routeHash("dir", dir.path),
          dir.name,
          String(itemCount) + " 個項目",
          true
        ));
      });

      files.forEach((script) => {
        browseList.append(createEntry(
          routeHash("file", script.path),
          script.name,
          script.extension.toUpperCase().slice(1),
          false
        ));
      });

      showOnly(byId("browse-view"));
    }

    function countItems(node) {
      let count = node.dirs.size + node.files.length;
      return count;
    }

    async function renderScript(path) {
      const script = scriptByPath.get(path);
      if (!script) {
        showError("找不到腳本：" + path);
        return;
      }

      const requestId = ++activeRequest;
      const segments = path.split("/");
      const fileName = segments.pop();
      document.title = fileName + " | APDL 腳本目錄";
      renderBreadcrumb(segments, fileName);
      scriptTitle.textContent = fileName;
      scriptStatus.className = "catalog-status";
      scriptStatus.textContent = "正在載入腳本內容…";
      scriptStatus.hidden = false;
      scriptPanel.hidden = true;
      scriptCode.textContent = "";
      showOnly(byId("script-view"));

      try {
        const response = await fetch(
          new URL(script.url, document.baseURI),
          { cache: "no-cache" }
        );
        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }
        const content = await response.text();
        if (requestId !== activeRequest) {
          return;
        }
        scriptCode.textContent = content;
        scriptStatus.hidden = true;
        scriptPanel.hidden = false;
      } catch (error) {
        if (requestId !== activeRequest) {
          return;
        }
        scriptStatus.className = "catalog-error";
        scriptStatus.textContent =
          "腳本內容載入失敗，請稍後重新整理頁面。";
      }
    }

    function renderRoute() {
      const hash = window.location.hash.slice(1);
      if (!hash) {
        renderBrowse("");
        return;
      }

      const separator = hash.indexOf("=");
      if (separator < 1) {
        showError("網址格式不正確。");
        return;
      }

      const type = hash.slice(0, separator);
      let value;
      try {
        value = decodeURIComponent(hash.slice(separator + 1));
      } catch (error) {
        showError("網址內容無法解析。");
        return;
      }

      if (type === "dir") {
        renderBrowse(value);
      } else if (type === "file") {
        renderScript(value);
      } else {
        showError("網址指定了未知的頁面。");
      }
    }

    window.addEventListener("hashchange", renderRoute);
    renderRoute();
  })();
</script>
